name: Build Korean map tiles

# Cuts roads, speed limits and speed cameras for South Korea out of the OpenStreetMap extract and
# publishes them on GitHub Pages, where the app fetches them before falling back to the public
# Overpass servers (see src/services/mapcache.ts). Needs Pages enabled with "GitHub Actions" as
# the source (repository Settings → Pages). With the DATA_GO_KR_KEY secret (a 공공데이터포털 service
# key with the 전국무인교통단속카메라표준데이터 API applied for), the official speed cameras replace
# OpenStreetMap's.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 2 * *' # monthly, early morning in Korea

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: map-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      # Optional: the national speed camera dataset, if the DATA_GO_KR_KEY secret is set.
      - name: Download official speed cameras
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-cameras.ts cameras.json

      - name: Download the South Korea extract
        run: |
          # Geofabrik first; openstreetmap.fr's extract of the same data if it's down.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 30 -o korea.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf \
            || curl -fsSL --retry 3 --retry-all-errors --retry-delay 30 -o korea.osm.pbf https://download.openstreetmap.fr/extracts/asia/south_korea-latest.osm.pbf
          ls -la korea.osm.pbf
          osmium fileinfo -g header.option.osmosis_replication_timestamp korea.osm.pbf | cut -c1-10 > built.txt
          echo "Data as of $(cat built.txt)"

      - name: Keep roads and speed cameras
        run: |
          osmium tags-filter korea.osm.pbf w/highway n/highway=speed_camera -o roads.osm.pbf
          osmium export roads.osm.pbf -f geojsonseq -x print_record_separator=false \
            --geometry-types=point,linestring -o roads.geojsonseq
          ls -la roads.osm.pbf roads.geojsonseq

      - name: Cut into tiles
        run: |
          node --max-old-space-size=12000 scripts/build-tiles.ts roads.geojsonseq site "$(cat built.txt)" cameras.json
          du -sh site
          find site -type f | wc -l

      # Coastlines, rivers and lakes for the route overview (after the tiles: merges into index.json).
      - name: Coastlines and water
        run: |
          osmium tags-filter korea.osm.pbf w/natural=coastline w/waterway=river nwr/natural=water nwr/waterway=riverbank -o geo.osm.pbf
          osmium export geo.osm.pbf -f geojsonseq -x print_record_separator=false \
            --geometry-types=linestring,polygon -o geo.geojsonseq
          node --max-old-space-size=8000 scripts/build-geo.ts geo.geojsonseq site
          du -sh site/geo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      # Check the live site: the index, and the tile for 청라 (Incheon), counted.
      - name: Check the published tiles
        run: |
          base='${{ steps.deploy.outputs.page_url }}'
          curl -fsS "${base}index.json"; echo
          # 청라 area coarse tile: coastline should be there.
          curl -fsS "${base}geo/375/1013.json" -o geo.json && node -e 'const g=require("./geo.json"); console.log(`청라 geo tile: ${g.c.length} coast, ${g.r.length} river, ${g.w.length} water`)' || echo "no geo tile"
          curl -fsS "${base}v1/3753/10131.json" -o tile.json
          node -e '
            const t = require("./tile.json");
            const drivable = t.w.filter((w) => w[0] & 1).length;
            const limits = t.w.filter((w) => w[1] > 0).map((w) => w[1]);
            console.log(`청라 tile: ${t.w.length} ways, ${drivable} drivable, ${limits.length} with limits [${[...new Set(limits)].sort((a, b) => a - b)}], ${t.c.length} cameras, ${require("fs").statSync("tile.json").size} bytes`);
          '
